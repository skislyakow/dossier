name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy main/
      - name: Tests
        run: uv run pytest
      - name: No pending migrations
        run: uv run manage.py makemigrations --check --dry-run
      - name: Content audit (tags ↔ skills)
        run: |
          uv run manage.py migrate --noinput
          uv run manage.py audit_content
      - name: JS syntax check
        run: for f in static/js/*.js; do node --check "$f"; done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/dossier
            git fetch origin main
            git checkout -f -B main origin/main
            git clean -fd
            export PATH="$HOME/.local/bin:$PATH"
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
            uv sync --frozen --no-dev
            uv run manage.py migrate --noinput
            uv run manage.py createcachetable
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
                fonts-dejavu-core fonts-dejavu-extra
            RESUME_AUTOGEN=1 uv run manage.py generate_resume
            uv run manage.py collectstatic --noinput
            chown -R www-data:www-data /var/www/dossier/static
            systemctl restart dossier

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prod smoke (endpoints)
        run: bash tools/smoke.sh https://kislyakov.pro
      - name: Prod static свежая (байт-в-байт с репо)
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            curl -fsSL -o /dev/null https://kislyakov.pro/ && break || sleep 3
          done
          fail=0
          for f in static/js/*.js static/css/*.css static/favicon.svg static/og/og-image.png; do
            if curl -fsSL "https://kislyakov.pro/$f" | cmp -s - "$f"; then
              echo "ok  $f"
            else
              echo "::error::прод отстаёт/отличается: $f"
              fail=1
            fi
          done
          exit "$fail"
