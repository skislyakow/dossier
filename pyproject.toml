[project]
name = "dossier"
version = "0.1.0"
description = "Персональный сайт-визитка Сергея Кислякова"
requires-python = ">=3.12"
dependencies = [
    "django==6.0.4",
    "gunicorn==23.0.0",
    "django-unfold==0.100.0",
]

[dependency-groups]
dev = [
    "django-stubs==5.1.3",
    "mypy==1.15.0",
    "ruff==0.15.20",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.uv]
package = false
