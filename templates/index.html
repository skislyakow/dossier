                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </a>
            <a href="#" id="portfolio-btn" class="social-link portfolio-link" aria-label="Портфолио">

        </div>
        <div class="hero-timeline" id="hero-timeline">
            <div class="timeline-track">
                <div class="tl-line"></div>
                <div class="tl-progress" id="timeline-progress"></div>
                <div class="tl-dots" id="timeline-dots"></div>
            </div>
        </div>

    <div class="content-body">
        <div class="tl-details" id="timeline-details"></div>
        <div id="stats" class="stats hidden"></div>
        <div id="portfolio" class="portfolio hidden"></div>
        <div id="contact" class="contact hidden">
            <div class="contact-card" id="contact-card"></div>
        </div>
    </div>
    <script src="{% static 'js/typing.js' %}"></script>
    <script src="{% static 'js/github.js' %}"></script>
    <script src="{% static 'js/portfolio.js' %}"></script>
    <script src="{% static 'js/timeline.js' %}"></script>
    <script src="{% static 'js/typewriter.js' %}"></script>
    <script>
        (function() {
            var hero = document.querySelector('.hero');
            if (!hero) return;
            hero.addEventListener('mousemove', function(e) {
                var rect = hero.getBoundingClientRect();
                var x = ((e.clientX - rect.left) / rect.width) * 100;
                var y = ((e.clientY - rect.top) / rect.height) * 100;
                hero.style.setProperty('--mx', x + '%');
                hero.style.setProperty('--my', y + '%');
            });
        })();
    </script>
    <script>
        (function() {
            var el = document.getElementById('current-time');
            if (!el) return;
            function updateTime() {
                el.textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ' MSK';
            }
            updateTime();
            setInterval(updateTime, 30000);
        })();
    </script>
    <script>
        (function() {
            var btn = document.getElementById('contact-btn');
            var section = document.getElementById('contact');
            if (!btn || !section) return;
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                section.classList.toggle('hidden');
                section.classList.toggle('show');
                if (!section.classList.contains('hidden')) {
                    setTimeout(function() {
                        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 150);
                }
            });
        })();
    </script>
    <script src="{% static 'js/ghost.js' %}"></script>
    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
        <svg height="20" width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>
    <script>
        (function() {
            var btn = document.getElementById('back-to-top');
            if (!btn) return;
            window.addEventListener('scroll', function() {
                btn.classList.toggle('visible', window.scrollY > 300);
            });
            btn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();
    </script>
    <script>
        (function() {
            var el = document.getElementById('portfolio');
            if (!el) return;
            el.addEventListener('mousemove', function(e) {
                var rect = el.getBoundingClientRect();
                var x = ((e.clientX - rect.left) / rect.width) * 100;
                var y = ((e.clientY - rect.top) / rect.height) * 100;
                el.style.setProperty('--mx', x + '%');
                el.style.setProperty('--my', y + '%');
            });
        })();
    </script>
    <script>
        (function() {
            var container = document.getElementById('skills-cloud');
            if (!container) return;
            fetch('/api/skills/').then(function(r) { return r.json(); }).then(function(skills) {
                container.innerHTML = skills.map(function(s) {
                    return '<span class="tag tag-' + s.size + '">' + s.name + '</span>';
                }).join('');
            }).catch(function() {});
        })();
    </script>
    <script>
        (function() {
            var container = document.getElementById('contact-card');
            if (!container) return;
            fetch('/api/contact/').then(function(r) { return r.json(); }).then(function(items) {
                container.innerHTML = items.map(function(item) {
                    var href = item.type === 'email' ? 'mailto:' + item.value : 'https://t.me/' + item.value.replace('@', '');
                    var icon = item.type === 'email'
                        ? '<svg height="20" width="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'
                        : '<svg height="20" width="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>';
                    var target = item.type === 'telegram' ? ' target="_blank" rel="noopener noreferrer"' : '';
                    return '<a href="' + href + '"' + target + ' class="contact-item">' + icon + '<span>' + item.label + '</span></a>';
                }).join('');
            }).catch(function() {});
        })();
    </script>
    <script>
        (function() {
            var root = document.documentElement;
            var toggle = document.getElementById('theme-toggle');
            var stored = localStorage.getItem('theme');
            if (stored === 'dark') {
                root.removeAttribute('data-theme');
            } else {
                root.setAttribute('data-theme', 'light');
                if (!stored) localStorage.setItem('theme', 'light');
            }
            if (!toggle) return;
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                var isLight = root.getAttribute('data-theme') === 'light';
                if (isLight) {
                    root.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'dark');
                } else {
                    root.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                }
            });
        })();
    </script>
</body>
</html>
