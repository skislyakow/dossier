# Nginx vhost for kislyakov.pro (Dossier).
#
# Pre-TLS source of truth. Place at /etc/nginx/sites-available/dossier and symlink
# into sites-enabled, then run certbot — it injects the TLS server block and the
# HTTP→HTTPS redirect (don't hand-write those):
#
#   ln -sf /etc/nginx/sites-available/dossier /etc/nginx/sites-enabled/dossier
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d kislyakov.pro -d www.kislyakov.pro
#
# `listen 80 default_server` is required: this box has no default site, and
# kislyakov.pro is the catch-all vhost.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kislyakov.pro www.kislyakov.pro;

    location /static/ {
        alias /var/www/dossier/static/;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    # Legacy locations kept from the live config — verify before re-enabling on a
